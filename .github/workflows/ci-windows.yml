name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python for Qt installer
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Qt 6.10.3 for MSVC 2022 x64
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir C:\Qt

      - name: Configure, build, and test
        shell: pwsh
        run: |
          cmake --preset windows-release -DCMAKE_PREFIX_PATH=C:/Qt/6.10.3/msvc2022_64
          cmake --build --preset windows-release
          ctest --preset windows-release

      - name: Build and test firmware host logic
        shell: pwsh
        run: |
          cmake -S firmware/tests -B out/build/firmware-host-tests-ci `
            -G "Visual Studio 17 2022" -A x64
          cmake --build out/build/firmware-host-tests-ci --config Release
          ctest --test-dir out/build/firmware-host-tests-ci `
            -C Release --output-on-failure
