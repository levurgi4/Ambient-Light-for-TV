name: Windows portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for Qt installer
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # aqtinstall 3.3 cannot read the changed Qt 6.11 repository layout.
      # Qt 6.10.3 is newer than the project's Qt 6.5 minimum and uses the
      # supported layout.
      - name: Install Qt 6.10.3 for MSVC 2022 x64
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir C:\Qt

      - name: Configure, build, and test
        shell: pwsh
        run: |
          cmake --preset windows-release -DCMAKE_PREFIX_PATH=C:/Qt/6.10.3/msvc2022_64
          cmake --build --preset windows-release
          ctest --preset windows-release

      - name: Create portable ZIP and SHA-256
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            .\tools\package_windows.ps1 -Version "${{ github.ref_name }}"

      - name: Keep corresponding Qt source
        shell: pwsh
        run: |
          $sourceDirectory = New-Item -ItemType Directory -Force `
            -Path out/third-party-source
          $archives = @(
            @{
              Name = "qtbase-everywhere-src-6.10.3.tar.xz"
              Sha256 = "383dc907816338f0cba72088a524c07458dfc69ce684ca9132fcc4fe91c24b0b"
            },
            @{
              Name = "qttranslations-everywhere-src-6.10.3.tar.xz"
              Sha256 = "52689984b114d4d34516d5d7bfb0c75857b1c3ff529921042144f09ab2de3a83"
            }
          )
          foreach ($archive in $archives) {
            $uri = "https://download.qt.io/official_releases/qt/6.10/6.10.3/submodules/$($archive.Name)"
            $path = Join-Path $sourceDirectory $archive.Name
            Invoke-WebRequest -Uri $uri -OutFile $path
            $hash = Get-FileHash -LiteralPath $path -Algorithm SHA256
            $actualHash = $hash.Hash.ToLowerInvariant()
            if ($actualHash -ne $archive.Sha256) {
              throw "Qt source checksum mismatch for $($archive.Name)."
            }
            $line = "{0} *{1}" -f $actualHash, $archive.Name
            Set-Content -LiteralPath "$path.sha256" -Value $line -Encoding ascii
          }

      - name: Keep workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ambilight-by-Levurgi4-${{ github.ref_name }}-windows-x64
          path: |
            out/packages/*.zip
            out/packages/*.sha256
            out/third-party-source/*
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem out/packages/*.zip -File -ErrorAction Stop).FullName
            (Get-ChildItem out/packages/*.sha256 -File -ErrorAction Stop).FullName
          ) + @(
            Get-ChildItem out/third-party-source/* -File -ErrorAction Stop |
              Select-Object -ExpandProperty FullName
          )
          gh release create "${{ github.ref_name }}" @assets `
            --verify-tag `
            --title "Ambilight by Levurgi4 ${{ github.ref_name }}" `
            --generate-notes
